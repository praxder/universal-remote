name: Release

# Fires when development is merged into main. The "Update version" job runs
# python-semantic-release to decide whether the merged conventional commits
# warrant a release; it bumps pyproject.toml, commits, and tags ONLY
# (vcs_release: false — it does not create the GitHub Release). "Build" then
# creates the GitHub Release (with PSR's grouped notes) and attaches the binary,
# and "Update Homebrew formula" rewrites Formula/universal-remote.rb IN THIS
# REPO — the repository is its own tap — and commits it to main, the branch
# Homebrew reads a tap from. Both downstream jobs run only when a release
# happened.
#
# Both pushes to main authenticate as the org's CI bot GitHub App, which the
# org rulesets grant bypass_mode: always. The default GITHUB_TOKEN /
# github-actions[bot] is NOT an eligible ruleset bypass actor and cannot push
# to main here. "Build" stays on GITHUB_TOKEN: publishing a release needs no
# bypass.
#
# Both automated commits carry "[skip ci]" — the version bump via
# [tool.semantic_release] commit_message in pyproject.toml, the formula bump
# below. That is load-bearing, not cosmetic: unlike GITHUB_TOKEN, an
# App-authored push DOES re-fire `on: push: main`, so removing either marker
# creates an endless release loop.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Update version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_notes: ${{ steps.version.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mint CI bot App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: 4117226 # RightNow CI bot; on the rulesets' bypass list
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Bump version + tag
        id: version
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          # PSR pushes to hvcs_client.remote_url(use_token=True) — it builds its
          # own authenticated remote from this input rather than using the
          # credential checkout persisted, so handing it the App token is the
          # whole bypass. ignore_token_for_push is left at its default (false).
          github_token: ${{ steps.app-token.outputs.token }}
          git_committer_name: ${{ steps.app-token.outputs.app-slug }}[bot]
          git_committer_email: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          vcs_release: "false" # bump + commit + tag only; the build job creates the release

  build:
    name: Build
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: macos-14 # Apple Silicon runner → native arm64 build, no cross-compile
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      # Check out the tag the version job just created so the bumped pyproject
      # version is the one baked into the frozen binary (it reads
      # importlib.metadata at build time). Checking out the default ref would
      # freeze the pre-bump version and fail the smoke test below.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Build binary
        run: ./packaging/build_binary.sh
      - name: Package + checksum
        id: package
        run: |
          asset="universal-remote-macos-arm64.tar.gz"
          tar -C dist -czf "$asset" universal-remote
          sha="$(shasum -a 256 "$asset" | awk '{print $1}')"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Smoke test frozen binary
        run: |
          out="$(./dist/universal-remote/universal-remote --version)"
          echo "$out"
          echo "$out" | grep -qF "${{ needs.version.outputs.version }}" || {
            echo "version mismatch: '$out' does not contain ${{ needs.version.outputs.version }}"
            exit 1
          }
      - name: Create GitHub Release + upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ needs.version.outputs.release_notes }}
        run: |
          printf '%s' "$NOTES" > release-notes.md
          gh release create "${{ needs.version.outputs.tag }}" \
            universal-remote-macos-arm64.tar.gz \
            --title "${{ needs.version.outputs.tag }}" \
            --notes-file release-notes.md \
            --verify-tag

  tap:
    name: Update Homebrew formula
    needs: [version, build]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mint CI bot App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: 4117226 # RightNow CI bot; on the rulesets' bypass list
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          permission-contents: write
      # main, not the release tag: Homebrew reads a tap from the default branch,
      # and the version job has already pushed the bump commit there. Checking
      # out with the App token persists it as origin's credential, so the pull
      # and push below both authenticate as the bypass-eligible App.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history, so the pull --rebase below has a merge base
          token: ${{ steps.app-token.outputs.token }}
      - name: Rewrite formula
        run: |
          version="${{ needs.version.outputs.version }}"
          sha="${{ needs.build.outputs.sha256 }}"
          formula="Formula/universal-remote.rb"
          sed -i -E "s|releases/download/v[^/]+/|releases/download/v${version}/|" "$formula"
          sed -i -E "s|^  version \".*\"|  version \"${version}\"|" "$formula"
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${sha}\"|" "$formula"
          git diff "$formula"
      - name: Commit + push
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add Formula/universal-remote.rb
          # [skip ci] is required, not tidy: an App-authored push re-fires
          # `on: push: main`, and without it this commit starts a second run.
          git commit -m "chore: universal-remote ${{ needs.version.outputs.version }} [skip ci]"
          # concurrency: release serialises runs, but the version job pushed to
          # main after this job's checkout was queued — rebase rather than race.
          git pull --rebase
          git push
